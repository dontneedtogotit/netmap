<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c2333" />
      <stop offset="100%" stop-color="#0c0e14" />
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ece6a" />
      <stop offset="50%" stop-color="#7dcfff" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bgGrad)" stroke="#2a334d" stroke-width="4" />

  <!-- Network Connection Links -->
  <g stroke="url(#lineGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="128" y1="58" x2="68" y2="148" />
    <line x1="128" y1="58" x2="188" y2="148" />
    <line x1="68" y1="148" x2="128" y2="202" />
    <line x1="188" y1="148" x2="128" y2="202" />
    <line x1="128" y1="58" x2="128" y2="202" stroke-dasharray="8 6" opacity="0.5" />
    <line x1="68" y1="148" x2="188" y2="148" stroke-dasharray="6 6" opacity="0.4" />
  </g>

  <!-- Central Hub (Router) -->
  <g filter="url(#glow)">
    <!-- Top Central Node (Gateway) -->
    <circle cx="128" cy="58" r="22" fill="#131826" stroke="#7dcfff" stroke-width="4" />
    <circle cx="128" cy="58" r="9" fill="#7dcfff" />

    <!-- Left Node (Host PC) -->
    <circle cx="68" cy="148" r="18" fill="#131826" stroke="#9ece6a" stroke-width="4" />
    <circle cx="68" cy="148" r="7" fill="#9ece6a" />

    <!-- Right Node (Smart TV / IoT) -->
    <circle cx="188" cy="148" r="18" fill="#131826" stroke="#e0af68" stroke-width="4" />
    <circle cx="188" cy="148" r="7" fill="#e0af68" />

    <!-- Bottom Node (WAN / Cloud) -->
    <circle cx="128" cy="202" r="16" fill="#131826" stroke="#bb9af7" stroke-width="4" />
    <circle cx="128" cy="202" r="6" fill="#bb9af7" />
  </g>
</svg>
